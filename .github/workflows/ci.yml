name: ci

on:
  push:
  pull_request:

jobs:
  protocol-vectors:
    name: protocol vectors (kotlin + python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin vectors
        run: ./gradlew :core:kotlin:test --no-daemon
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python vectors
        run: |
          python -m pip install --upgrade pip cryptography
          python tools/vector-runner/py/runner.py

  android:
    name: android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew :apps:phone:app:assembleDebug --no-daemon

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
